<title>__REPORT_TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: one reading column. Verdict first, then the progress line, the four counts, the findings by seriousness, then what passed. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --ink: #18212f;
  --muted: #586478;
  --line: #dce2eb;
  --accent: #2b4fc7;
  --critical: #b3261e;
  --critical-bg: #fceceb;
  --warning: #8f5800;
  --warning-bg: #fcf1dc;
  --pass: #1b6e45;
  --pass-bg: #e4f3ea;
  --quiet-bg: #eceff4;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151c;
    --surface: #19202a;
    --ink: #e7ecf3;
    --muted: #9ba7b9;
    --line: #2a3442;
    --accent: #93a8ff;
    --critical: #ff8a80;
    --critical-bg: #3a1d1b;
    --warning: #f0b955;
    --warning-bg: #382b12;
    --pass: #63d19c;
    --pass-bg: #14301f;
    --quiet-bg: #222b37;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151c;
  --surface: #19202a;
  --ink: #e7ecf3;
  --muted: #9ba7b9;
  --line: #2a3442;
  --accent: #93a8ff;
  --critical: #ff8a80;
  --critical-bg: #3a1d1b;
  --warning: #f0b955;
  --warning-bg: #382b12;
  --pass: #63d19c;
  --pass-bg: #14301f;
  --quiet-bg: #222b37;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
}
.page {
  max-width: 800px;
  margin: 0 auto;
  padding-block: 32px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 28px;
}
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: var(--accent); }
a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.label {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--muted);
}

/* Header and verdict */
.head { display: flex; flex-direction: column; gap: 6px; }
.head h1 { font-size: 26px; line-height: 1.2; font-weight: 600; }
.head .meta { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.verdict {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 20px 22px;
  display: flex;
  gap: 16px;
  align-items: flex-start;
}
.verdict .mark {
  flex: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-family: var(--display);
  font-weight: 600;
  font-size: 20px;
}
.verdict .text { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.verdict h2 { font-size: 20px; font-weight: 600; line-height: 1.3; }
.verdict p { color: var(--muted); }
.verdict[data-state="ready"] .mark { background: var(--pass-bg); color: var(--pass); }
.verdict[data-state="action"] .mark { background: var(--warning-bg); color: var(--warning); }
.verdict[data-state="blocked"] .mark { background: var(--critical-bg); color: var(--critical); }
.verdict[data-state="waiting"] .mark { background: var(--quiet-bg); color: var(--muted); }

/* Progress line */
.steps {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
  gap: 14px 10px;
}
.steps li { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.steps .bar { height: 5px; border-radius: 3px; background: var(--line); }
.steps li[data-state="done"] .bar { background: var(--pass); }
.steps li[data-state="current"] .bar { background: var(--accent); }
.steps .name { font-weight: 600; font-size: 14px; line-height: 1.3; }
.steps li[data-state="todo"] .name { color: var(--muted); font-weight: 500; }
.steps .note { font-size: 13px; color: var(--muted); line-height: 1.4; }

/* Counts */
.counts {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.count {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.count .num {
  font-family: var(--display);
  font-size: 30px;
  font-weight: 600;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.count .what { font-size: 13px; color: var(--muted); line-height: 1.35; }
.count[data-level="critical"] .num { color: var(--critical); }
.count[data-level="warning"] .num { color: var(--warning); }
.count[data-level="pass"] .num { color: var(--pass); }
.count[data-zero="true"] .num { color: var(--muted); }
.count .num.pending { font-size: 18px; line-height: 1.85; font-weight: 500; }

/* Sections */
section { display: flex; flex-direction: column; gap: 12px; }
.sec-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sec-head h2 { font-size: 19px; font-weight: 600; }
.sec-head .sub { color: var(--muted); font-size: 14px; }
.group {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
}
.empty { padding: 16px 20px; color: var(--muted); font-size: 15px; }

/* One finding */
.finding { padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.finding + .finding { border-top: 1px solid var(--line); }
.finding .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  display: inline-flex;
  align-items: center;
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  padding: 5px 9px;
  border-radius: 999px;
  white-space: nowrap;
  background: var(--quiet-bg);
  color: var(--muted);
}
.chip.id { font-variant-numeric: tabular-nums; color: var(--ink); }
.chip[data-level="critical"] { background: var(--critical-bg); color: var(--critical); }
.chip[data-level="warning"] { background: var(--warning-bg); color: var(--warning); }
.chip[data-decision="approved"], .chip[data-decision="fixed"] { background: var(--pass-bg); color: var(--pass); }
.chip[data-decision="waiting"] { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.finding h3 { font-size: 17px; font-weight: 600; line-height: 1.35; }
.finding .meaning { max-width: 65ch; }
.finding .where { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.fix {
  background: var(--quiet-bg);
  border-radius: 10px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.fix p { max-width: 65ch; }
.finding .note { font-size: 14px; color: var(--muted); }
details.tech { font-size: 14px; color: var(--muted); }
details.tech summary { cursor: pointer; width: fit-content; }
details.tech div { margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }

/* Passed checks */
.passed { list-style: none; margin: 0; padding: 0; }
.passed li { padding: 12px 20px; display: flex; gap: 12px; align-items: flex-start; }
.passed li + li { border-top: 1px solid var(--line); }
.passed .tick {
  flex: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--pass-bg);
  color: var(--pass);
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 700;
  margin-top: 1px;
}
.passed .body { min-width: 0; }
.passed .name { font-weight: 600; }
.passed .detail { color: var(--muted); font-size: 14px; }

/* Plain lists */
.plain { margin: 0; padding: 16px 20px 16px 38px; display: flex; flex-direction: column; gap: 8px; }
.plain li { max-width: 65ch; }
.how {
  border: 1px dashed var(--line);
  border-radius: 12px;
  padding: 14px 18px;
  color: var(--muted);
  font-size: 15px;
}
.how strong { color: var(--ink); font-weight: 600; }
footer { color: var(--muted); font-size: 13px; }

@media (max-width: 560px) {
  .counts { grid-template-columns: repeat(2, 1fr); }
  .head h1 { font-size: 22px; }
  .verdict { padding: 16px; }
  .finding { padding: 16px; }
}
</style>

<main class="page" id="page"></main>
<script type="application/json" id="report-data">__REPORT_DATA__</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById("report-data").textContent);
  var page = document.getElementById("page");

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }
  function add(parent) {
    for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]);
    return parent;
  }

  var LEVELS = {
    critical: { chip: "Must fix", heading: "Must fix before merging", sub: "Real problems. Merging with these would cause harm or break a rule." },
    warning: { chip: "Worth a look", heading: "Worth a look", sub: "Not dangerous, but likely to cause confusion or rework later." },
    suggestion: { chip: "Small suggestion", heading: "Small suggestions", sub: "Polish. Safe to skip." }
  };
  var DECISIONS = {
    waiting: "Waiting for your decision",
    approved: "You approved this fix",
    rejected: "You chose to leave it",
    fixed: "Fixed",
    closed: "Closed on GitHub"
  };
  function levelOf(f) { return LEVELS[f.level] ? f.level : "critical"; } /* an unknown level is shown at the top, never hidden */
  function decisionOf(f) { return DECISIONS[f.decision] ? f.decision : "waiting"; }
  function isOpen(f) { var d = decisionOf(f); return d === "waiting" || d === "approved"; }
  var MARKS = { ready: "✓", action: "!", blocked: "×", waiting: "…" };

  var pr = data.pr || {};
  var findings = data.findings || [];
  var passed = data.passed || [];

  /* Header */
  var head = el("header", "head");
  add(head, el("div", "label", "Pull request review"));
  add(head, el("h1", null, (pr.number ? "#" + pr.number + " " : "") + (pr.title || "Pull request")));
  var meta = el("div", "meta");
  var bits = [];
  if (data.reviewer && data.reviewer.name) {
    bits.push("Reviewer: " + data.reviewer.name + (data.reviewer.status ? " (" + data.reviewer.status + ")" : ""));
  }
  if (data.generated) bits.push("Report made " + data.generated);
  meta.textContent = bits.join("  ·  ");
  if (pr.url && /^https:\/\/github\.com\//.test(pr.url)) {
    if (bits.length) meta.appendChild(document.createTextNode("  ·  "));
    var link = el("a", null, "Open on GitHub");
    link.href = pr.url;
    link.target = "_blank";
    link.rel = "noopener";
    meta.appendChild(link);
  }
  add(head, meta);
  add(page, head);

  /* Verdict */
  var v = data.verdict || {};
  var verdict = el("div", "verdict");
  verdict.dataset.state = v.state || "waiting";
  var vt = el("div", "text");
  add(vt, el("h2", null, v.headline || ""), v.detail ? el("p", null, v.detail) : null);
  var mark = el("div", "mark", MARKS[v.state] || MARKS.waiting);
  mark.setAttribute("aria-hidden", "true");
  add(verdict, mark, vt);
  add(page, verdict);

  /* Progress */
  if ((data.steps || []).length) {
    var sec = el("section");
    add(sec, el("div", "label", "Review progress"));
    var ol = el("ol", "steps");
    data.steps.forEach(function (s) {
      var li = el("li");
      var state = s.state || "todo";
      li.dataset.state = state;
      if (state === "current") li.setAttribute("aria-current", "step");
      var name = el("div", "name", s.label);
      name.appendChild(el("span", "sr", state === "done" ? " (done)" : state === "current" ? " (current step)" : " (not started)"));
      add(li, el("div", "bar"), name, s.note ? el("div", "note", s.note) : null);
      ol.appendChild(li);
    });
    add(page, add(sec, ol));
  }

  /* Counts */
  var notReviewed = data.reviewed !== true;
  function countOf(level) {
    var n = findings.filter(function (f) { return levelOf(f) === level && isOpen(f); }).length;
    /* Before a review exists, a zero would read as an all-clear. Show "not yet" unless a house check found something. */
    return notReviewed && n === 0 ? null : n;
  }
  var counts = el("div", "counts");
  [["critical", countOf("critical"), "Must fix, still open"], ["warning", countOf("warning"), "Worth a look, still open"],
   ["suggestion", countOf("suggestion"), "Small suggestions, still open"], ["pass", passed.length, "Checks passed"]]
    .forEach(function (c) {
      var tile = el("div", "count");
      tile.dataset.level = c[0];
      tile.dataset.zero = String(!c[1]);
      var num = el("div", "num", c[1] === null ? "not yet" : String(c[1]));
      if (c[1] === null) num.classList.add("pending");
      add(tile, num, el("div", "what", c[2]));
      counts.appendChild(tile);
    });
  add(page, counts);

  /* How to decide */
  var waiting = findings.filter(function (f) { return decisionOf(f) === "waiting"; });
  if (waiting.length) {
    var how = el("div", "how");
    how.appendChild(el("strong", null, "Your call. "));
    how.appendChild(document.createTextNode(
      "Nothing changes until you say so. Tell Claude in the chat which fixes to make, for example: approve " +
      waiting[0].id + (waiting[1] ? ", skip " + waiting[1].id : "") + ". You can also ask about any item by its code."));
    add(page, how);
  }

  /* Findings by level */
  function findingNode(f) {
    var node = el("article", "finding");
    var top = el("div", "top");
    var lvl = el("span", "chip", LEVELS[levelOf(f)].chip);
    lvl.dataset.level = levelOf(f);
    var dec = el("span", "chip", DECISIONS[decisionOf(f)]);
    dec.dataset.decision = decisionOf(f);
    add(top, el("span", "chip id", f.id || "?"), lvl, dec);
    add(node, top, el("h3", null, f.title));
    if (f.meaning) add(node, el("p", "meaning", f.meaning));
    if (f.where || f.source) {
      add(node, el("div", "where", [f.where, f.source ? "Found by " + f.source : null].filter(Boolean).join("  ·  ")));
    }
    if (f.fix) {
      var fix = el("div", "fix");
      add(fix, el("div", "label", "Recommended fix"), el("p", null, f.fix));
      add(node, fix);
    }
    if (f.note) add(node, el("div", "note", f.note));
    if (f.technical) {
      var d = el("details", "tech");
      add(d, el("summary", null, "Technical detail"), el("div", null, f.technical));
      add(node, d);
    }
    return node;
  }
  ["critical", "warning", "suggestion"].forEach(function (level) {
    var list = findings.filter(function (f) { return levelOf(f) === level; });
    var openCount = list.filter(isOpen).length;
    var sec = el("section");
    var sh = el("div", "sec-head");
    var pending = notReviewed && !list.length;
    var tally = pending ? "" : " (" + openCount + " open" + (list.length > openCount ? ", " + (list.length - openCount) + " dealt with" : "") + ")";
    add(sh, el("h2", null, LEVELS[level].heading + tally), el("span", "sub", LEVELS[level].sub));
    var group = el("div", "group");
    if (!list.length) add(group, el("div", "empty", notReviewed ? "No review results yet." : "Nothing in this group."));
    list.forEach(function (f) { group.appendChild(findingNode(f)); });
    add(page, add(sec, sh, group));
  });

  /* Passed */
  var psec = el("section");
  var ph = el("div", "sec-head");
  add(ph, el("h2", null, "Passed checks (" + passed.length + ")"));
  var pgroup = el("div", "group");
  if (!passed.length) add(pgroup, el("div", "empty", "No checks have passed yet."));
  else {
    var ul = el("ul", "passed");
    passed.forEach(function (p) {
      var li = el("li");
      var body = el("div", "body");
      add(body, el("div", "name", p.label),
        el("div", "detail", [p.detail, p.source ? "Checked by " + p.source : null].filter(Boolean).join("  ·  ")));
      var tick = el("span", "tick", "✓");
      tick.setAttribute("aria-hidden", "true");
      ul.appendChild(add(li, tick, body));
    });
    pgroup.appendChild(ul);
  }
  add(page, add(psec, ph, pgroup));

  /* Next steps and limits */
  [["What happens next", data.next, "ol"], ["Good to know", data.limits, "ul"]].forEach(function (block) {
    if (!(block[1] || []).length) return;
    var sec = el("section");
    var sh = el("div", "sec-head");
    add(sh, el("h2", null, block[0]));
    var group = el("div", "group");
    var list = el(block[2], "plain");
    block[1].forEach(function (t) { list.appendChild(el("li", null, t)); });
    add(page, add(sec, sh, add(group, list)));
  });

  add(page, el("footer", null, "Nothing in this pull request is merged or changed automatically. Every fix and every merge needs your go-ahead in the chat."));
})();
</script>
